module: analog_in
platforms: [arduino]
role: sensor
description: Sample one or more ADC pins into uplink frame channels.
claims:
  pins: adc                 # each entry of `pins` must be adc-capable on the board
provides:
  channels: per_pin         # one frame channel per configured pin (wire order = pin order)
config:
  sample_hz: 2              # informs the firmware's global sample period
  aref: default            # renesas-only: "external" → analogReference(AR_EXTERNAL) (AREF=5 V); no-op on AVR
  adc_bits: 0              # renesas-only: >0 → analogReadResolution; 0 = core 10-bit default. no-op on AVR
sources: [analog_in.h, analog_in.cpp]
