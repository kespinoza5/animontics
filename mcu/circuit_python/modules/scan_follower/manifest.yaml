module: scan_follower
platforms: [circuit_python]
role: sensor
description: >
  Scanned-matrix follower: waits for the conductor's DAC row broadcast, samples
  its own channels for that row, then acks by echoing the level on its own DAC.
  Emits the decoded row index as one frame channel (-1 on watch timeout, so a
  dead conductor is visible, not silent). List this module FIRST so the row
  tag is channel 0.
claims:
  watch_pin: adc            # reads the conductor's DAC broadcast
  ack_pin: dac              # this follower's ack DAC
provides:
  channels: 1                   # the decoded row index (or -1 sentinel)
config:
  rows: 16                      # must match the conductor's matrix_scan
  watch_pin: A1                 # AnalogIn watching the conductor's broadcast
  ack_pin: A0                   # AnalogOut echoing the level back (DAC-capable pin)
  settle_ms: 2                  # row decode → sample settle
  watch_timeout_ms: 250         # no new row level within this → emit row = -1
  max_code: 65535               # must match the conductor's matrix_scan
# Handshake spec lives in matrix_scan/manifest.yaml — the two must agree on
# rows and max_code (cross-contract validation is manual today; see TODO.md).
