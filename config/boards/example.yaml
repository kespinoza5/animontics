# config/boards/example.yaml — board wiring template
#
# This file is the template for config/boards/<node-id>.yaml staging copies.
# Those files are gitignored — only this example is tracked.
#
# In normal operation these files are written automatically:
#   animon pull <node-id>   — fetches live config from the board and stores it here
#   animon deploy <node-id> — updates staging copy after a successful deploy
#
# To create manually: copy this file to config/boards/<your-node-id>.yaml
# and fill in the physical wiring for that board.
#
# Schema reference:
#   node_id    — must match the id in config/nodes/<node-id>.yaml
#   node_type  — board type (orangepi_zero2 / raspberry_pi_5 / etc.)
#   hostname   — network hostname of this board
#
# Sensor connection types:
#   uart    — hardware UART or USB-to-serial adapter  (port, baud_rate)
#   usb_cdc — USB CDC device, e.g. RP2040/SAMD       (port, baud_rate)
#   i2c     — I2C bus                                 (bus, address)
#   ir      — Linux LIRC IR transceiver               (rx_device, tx_device)

# ── Node identity ──────────────────────────────────────────────────────────────
node_id:   my_sbc_node
node_type: raspberry_pi_5
hostname:  animontics-node

# ── HTTP server ────────────────────────────────────────────────────────────────
network:
  host: "0.0.0.0"
  port: 8080

# ── Camera (optional — RPi5 / Jetson only) ────────────────────────────────────
# camera:
#   enabled: true
#   device:  /dev/video0
#   width:   1280
#   height:  720
#   fps:     30

# ── Sensors ───────────────────────────────────────────────────────────────────
sensors: []

# Uncomment and edit the entries below for sensors physically connected to this
# board. Run 'animon probe <node-id>' to detect hardware automatically.

# ── Benewake TF Mini Plus LiDAR (UART) ────────────────────────────────────────
# RPi5: hardware UART on /dev/ttyAMA0 (GPIO 14/15, enable uart in config.txt)
# OrangePi Zero 2: /dev/ttyS0 or /dev/ttyAMA0 depending on overlay
#
# - id: lidar_front
#   type: tf_mini
#   enabled: true
#   connection:
#     type:      uart
#     port:      /dev/ttyAMA0
#     baud_rate: 115200

# ── MaxBotix LV-MaxSonar-EZ (UART) ────────────────────────────────────────────
# Pi Zero 2W: /dev/ttyS0 (enable uart0 overlay, disable console on serial)
#
# - id: sonar_side
#   type: lv_maxsonar
#   enabled: true
#   connection:
#     type:      uart
#     port:      /dev/ttyS0
#     baud_rate: 9600

# ── ST VL53L1X Time-of-Flight (I2C) ───────────────────────────────────────────
# OrangePi Zero 2: I2C bus 3 (pins 3/5 on the 26-pin header, enable i2c3 overlay)
# RPi5: I2C bus 1 (GPIO 2/3, enabled by default on most Pi OS images)
# Default I2C address: 0x29
#
# - id: tof_top
#   type: vl53l1x
#   enabled: true
#   connection:
#     type:    i2c
#     bus:     3
#     address: 0x29

# ── Melexis MLX90640 Thermal Camera (I2C) ─────────────────────────────────────
# RPi5: I2C bus 1 (GPIO 2/3)
# Requires 400 kHz I2C clock minimum; 1 MHz recommended for 32fps.
# Fixed I2C address: 0x33
#
# - id: thermal_rear
#   type: mlx90640
#   enabled: true
#   connection:
#     type:    i2c
#     bus:     1
#     address: 0x33

# ── IR Transceiver (LIRC) ──────────────────────────────────────────────────────
# OrangePi Zero 2: TSOP38238 receiver on IR_RX pin, TSAL6200 transmitter on PWM3
# Requires lirc kernel module + /dev/lirc* devices.
# Omit rx_device to disable receive; omit tx_device to disable transmit.
#
# - id: ir_xcvr
#   type: ir_xcvr
#   enabled: true
#   connection:
#     type:      ir
#     rx_device: /dev/lirc0
#     tx_device: /dev/lirc1

# ── Devices (shared peripherals: MCU links, ADS1115 chips) ────────────────────
# A device owns a transport; sensors read through it and effectors write through
# it. Built/flashed with tools/forge (config/mcus/<id>.yaml). Use the by-id path
# so an MCU survives re-enumeration on a shared USB hub.
#
# devices:
#   - {id: larduino, kind: mcu_serial, port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0, baud: 115200}
#   - {id: head_adc, kind: ads1115, bus: 1, address: 0x48}   # ADS1115 chip on the SBC's I2C
#
#   # u-blox SARA-R5 LTE-M + GNSS modem (one UART module, two logical sensors below).
#   # power_line/reset_line drive the LTE power-enable / reset pins via core/gpio.py;
#   # backend: libgpiod (SBC kernel GPIO), mcu (future), or none (uncontrolled).
#   - id: sara_r5_1
#     kind: sara_r5
#     port: /dev/ttyS5                 # OrangePi Zero 2 UART5
#     baud: 115200
#     params:
#       power_line: {backend: libgpiod, chip: gpiochip0, line: 262}   # PI6  (VERIFY on board)
#       reset_line: {backend: libgpiod, chip: gpiochip0, line: 272}   # PI16 (VERIFY on board)
#       # H616: PI bank → main pinctrl (gpiochip0); line = bank*32+pin (PI=8).
#       # Confirm with `gpioinfo` / `gpiofind` on the board — numbering varies.
#       # init: [ATE0, AT+CMEE=2, AT+CEREG=2, "AT+UGPS=1,1"]   # default; enables GNSS

# ── MQ Gas Sensor Array (reads an MCU device) ─────────────────────────────────
# A logical array sensor bound to one or more devices. Each channel maps a
# device + frame index to a gas signal + calibration; a sensor may span several
# devices (e.g. cranial pressure across 4 MCUs). No `connection` — it reads the
# device's stream.
#
# Preferred: list the device(s) and let `forge resolve <node>` fill `channels`
# from the MCU contract (config/mcus/<id>.yaml) — author the channel→signal map
# ONCE there, not again here. An explicit `channels` list (below) overrides.
#
# - id: gas_array
#   type: mq_array
#   devices: [larduino]            # → forge resolve fills channels from the contract
#
# - id: gas_array               # explicit form (escape hatch / no resolve)
#   type: mq_array
#   channels:
#     - {device: larduino, index: 0, signal: mq135, calibration: {type: raw}}
#     - {device: larduino, index: 1, signal: mq2,   calibration: {type: mq, rl: 10000, r0: 76000}}
#
# - id: fan_rpm                 # fan tach RPM, resolved from the LXiao contract
#   type: fan_tach
#   devices: [lxiao]

# ── OzzMaker LTE-M GPS + 10DOF board ──────────────────────────────────────────
# One physical board exposing a SARA-R5 modem (UART, the sara_r5 device above) and
# a 10DOF I2C stack. gnss_1 + lte_1 are two logical views of the one modem device;
# imu_1 reads the three I2C chips (LSM6DSL 0x6A, MMC5983MA 0x30, BMP388 0x77) —
# addresses are fixed silicon, so only the bus is configured.
#
# - id: gnss_1                  # GNSS position/velocity from the modem's NMEA stream
#   type: sara_r5_gnss
#   devices: [sara_r5_1]
#
# - id: lte_1                   # LTE signal quality / registration (AT poll)
#   type: sara_r5_lte
#   devices: [sara_r5_1]
#
# - id: imu_1                   # combined IMU + magnetometer + barometer
#   type: ozzmaker_10dof
#   connection: {type: i2c, bus: 3}

# ── Effectors (outputs: fans, LEDs, motors, …) ────────────────────────────────
# An effector writes through a device's command sink (e.g. an MCU's PWM). Channels
# carry a name (for the API/UX) and an index (the wire/command channel). Drive via
#   POST /effectors/<id>   {"levels": {"intake": 0.8}}   (request lane, 0.0–1.0)
# Continuous-flow types (speaker, LED strip) use WS /effectors/<id>/stream instead.
#
# effectors:
#   - id: chassis_fans
#     type: fan_array
#     backend: {device: lxiao}        # the MCU that drives the fan PWM
#     params:
#       min_duty: 0.3                  # non-zero level → [0.3, 1.0] so high-rpm fans
#       per_fan:  {exhaust: 0.4}       # start (0 = off); per-fan override
#     channels:
#       - {name: intake,  index: 0}
#       - {name: exhaust, index: 1}
#       - {name: aux,     index: 2}

# ── Policies (control loops) ──────────────────────────────────────────────────
# A policy maps observations (relay signal names, dotted: "<sensor>.<path>") to an
# effector's channels. `type` names a registered PolicyBase (the behavior is code,
# not config). `always_on` marks a reflex that keeps running when cortical policies
# are absent. The fan loop below drives the fans on the worse of gas / board temp.
#
# policies:
#   - id: fan_loop
#     type: curve
#     always_on: true
#     observation: [gas_array.raw.mq135, board_temp.cpu_c]
#     action: {effector: chassis_fans}
#     params: {in_min: [100, 35], in_max: [600, 75], out_min: 0.2, out_max: 1.0}
