# Animontics fleet configuration
# Documents the distributed system topology — which nodes exist, what they carry,
# and how they connect. This file does not control any server; it is a reference
# for developers and future fleet management tooling.

system_name: animontics-prototype-v1

# ── Nodes ─────────────────────────────────────────────────────────────────────

nodes:

  - id:       my_sbc_node
    hostname:  animontics-node
    ip:        192.168.1.x        # update to match your network
    type:      orangepi_zero2
    port:      8080
    sensors:
      - id: lidar_front
        type: tf_mini
    usb_attached:
      - pi_zero_sonar

  - id:       pi_zero_sonar
    hostname:  animontics-node
    type:      raspberry_pi_zero_2w
    port:      8080
    connection:
      via:  usb_gadget
      host: my_sbc_node       # appears on OrangePi via usbport
    sensors:
      - id: sonar_side
        type: lv_maxsonar

  - id:       my_rpi_node
    hostname:  animontics-node
    ip:        192.168.1.y
    type:      raspberry_pi_5
    port:      8080
    capabilities:
      - hailo_inference             # RPi5 + HAILO-10H NPU hat
    sensors:
      - id: thermal_rear
        type: mlx90640
      - id: webcam
        type: camera

  - id:       my_hub_node
    hostname:  animontics-node2
    ip:        192.168.1.z
    type:      neocore2
    port:      8080
    usb_mcus:
      - type:     rp2040
        usb_port: "1-1"
        role:     power_control     # controls enable/reboot for all boards
      - type:     rp2040
        usb_port: "1-2"
        role:     sensor_imu
      - type:     samd20
        usb_port: "1-3"
      - type:     arduino
        usb_port: "1-4"
      - type:     feather_m4
        usb_port: "1-5"

  - id:       jetson_nano
    hostname:  animontics-node
    ip:        192.168.1.w
    type:      nvidia_jetson_nano
    port:      8080
    capabilities:
      - cuda_inference

# ── Notes ─────────────────────────────────────────────────────────────────────
# FPGA fabric: connected to multiple boards via SPI/I2S.
#   Reconfiguration: NeoCore2 over USB (assisted by RP2040 power-control MCUs).
# Future: ADS1115 × 16 → RP2040 × 4 → NeoCore2 USB hub (60+ pressure readings).
