# Raspberry Pi Zero 2 W — SBC pin-capability profile.
#
# BCM numbering: header GPIO<N> = gpiochip0 line N on Pi 0/2/3/4 (the Pi 5
# moved to gpiochip4 — do not copy this file for it). Table is exhaustive
# for the 40-pin header.

node_type: raspberry_pi_zero_2w
logic_v: 3.3

gpio:
  chip: gpiochip0
  complete: true
  lines: {GPIO0: 0,   GPIO1: 1,   GPIO2: 2,   GPIO3: 3,   GPIO4: 4,   GPIO5: 5,
          GPIO6: 6,   GPIO7: 7,   GPIO8: 8,   GPIO9: 9,   GPIO10: 10, GPIO11: 11,
          GPIO12: 12, GPIO13: 13, GPIO14: 14, GPIO15: 15, GPIO16: 16, GPIO17: 17,
          GPIO18: 18, GPIO19: 19, GPIO20: 20, GPIO21: 21, GPIO22: 22, GPIO23: 23,
          GPIO24: 24, GPIO25: 25, GPIO26: 26, GPIO27: 27}

pwm:
  chips:
    0:
      pins: [GPIO12, GPIO13, GPIO18, GPIO19]   # PWM0 on 12/18, PWM1 on 13/19
      overlay: pwm-2chan (GPIO12=PWM0 + GPIO13=PWM1 — the auditory ear servos)

i2s:
  roles: {bclk: GPIO18, lrck: GPIO19, din: GPIO20, dout: GPIO21}
  overlay: enable via tools/board/setup_i2s.sh (PCM1808 master / Pi slave plan)
uart:
  roles: {tx: GPIO14, rx: GPIO15}
  overlay: enable_uart (tools/board/setup_uart.sh strips the console)
i2c:
  roles: {sda: GPIO2, scl: GPIO3}
  overlay: i2c_arm (tools/board/setup_i2c.sh)
