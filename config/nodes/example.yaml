# config/nodes/example.yaml — desired-state template
#
# Copy to config/nodes/<your-node-id>.yaml and fill in your values.
# Create one file per node — each file is a single YAML document.
#
# These files ARE committed to the repo. They contain NO secrets:
# no IPs, no SSH users, no port paths, no I2C addresses.
#
# Schema reference:
#   id           — unique node identifier, used as the key in animon.yaml
#   type         — board type (orangepi_zero2 / raspberry_pi_5 /
#                  raspberry_pi_zero_2w / neocore2 / etc.)
#   hostname     — network hostname of this board
#   port         — HTTP port the node agent listens on (default: 8080)
#   role         — free-text role label for documentation / tooling
#   capabilities — list of optional hardware capabilities
#   sensors      — list of {id, type} pairs — NO wiring details here
#   usb_mcus     — microcontrollers on this node's USB hubs. `id` links to a
#                  forge build contract at config/mcus/<id>.yaml; a sensor that
#                  reads the MCU's stream (e.g. mq_array) is listed under sensors.
#
# Wiring details (port paths, I2C bus/address, baud rates) go in
# config/boards/<id>.yaml, or are bootstrapped from sensor METADATA
# defaults by 'animon deploy'.
#
# For additional nodes: copy this file to config/nodes/<other-id>.yaml.

id:       my_sbc_node
type:     raspberry_pi_5
hostname: animontics-node
port:     8080
role:     vision

sensors:
  - id: lidar_front
    type: tf_mini
  - id: thermal_rear
    type: mlx90640
  - id: gas_array          # reads the larduino MCU's gas stream (see usb_mcus)
    type: mq_array
  - id: fan_rpm            # reads the lxiao MCU's fan tach (RPM)
    type: fan_tach
  - id: board_temp         # SBC thermal zones (sysfs) — connectionless, no device
    type: board_temp
  - id: rig_adc            # heterogeneous analog inputs via an SBC-side ADS1115
    type: analog_in
  - id: gnss_1             # GNSS from SARA-R5 modem (device-fed — needs sara_r5 device)
    type: sara_r5_gnss
  - id: lte_1              # LTE-M signal quality (device-fed — needs sara_r5 device)
    type: sara_r5_lte
  - id: imu_1              # OzzMaker 10DOF: LSM6DSL + MMC5983MA + BMP388 (one I2C sensor)
    type: ozzmaker_10dof
  # Wiring (ports, device bindings, GPIO, channels) lives in config/boards/<id>.yaml.
  # gnss_1 + lte_1 are two logical views of ONE sara_r5 device (one UART module);
  # that device — and the OzzMaker I2C bus — are declared in the board config.
  # Device-fed sensors (mq_array, fan_tach, analog_in) get their channels from the
  # MCU contract via `forge resolve <id>` — see config/boards/example.yaml.

# Microcontrollers on this node's USB hubs. Build/flash their firmware with
# `python -m tools.forge.forge build <id>` (contract at config/mcus/<id>.yaml).
usb_mcus:
  - id:       larduino     # → config/mcus/larduino.yaml (gas array + status LED)
    type:     arduino
    usb_port: "1-1"
    role:     gas_array
  - id:       lxiao        # → config/mcus/lxiao.yaml (XIAO RP2040: fans + tach)
    type:     rp2040
    usb_port: "1-2"
    role:     fan_control
