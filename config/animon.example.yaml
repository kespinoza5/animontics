# animon.example.yaml — Access layer template
#
# Copy to config/animon.yaml and fill in your values.
# config/animon.yaml is gitignored — keep real IPs and SSH users out of
# source control.
#
# This file is the AUTHORITATIVE source for each node's address: how to reach it
# (ip/hostname), the HTTP port the agent serves on, and SSH access. The node's own
# serving config (the bind in config/boards/<id>.yaml `network:`) is projected from
# `port` here at deploy — author the port ONCE, here.
# Sensor desired state (what each node should run) lives in config/nodes/
# (gitignored too; only config/nodes/example.yaml is tracked).
#
# Node IDs here must match the `id` fields in config/nodes/<id>.yaml.

system_name: my-animontics-system

defaults:
  ssh_user:    pi              # used when a node doesn't specify its own
  deploy_path: /opt/animontics

nodes:

  # Standard GbE node
  my_sbc_node:
    ip:       192.168.1.100
    ssh_user: orangepi         # overrides defaults.ssh_user for this node
    # port:   8080             # HTTP port the fleet connects to / agent serves on (default 8080)

  # Dual-homed node (GbE + WiFi)
  my_rpi5_node:
    ip:       192.168.1.111
    wifi_ip:  192.168.1.150    # optional — used as fallback if GbE unreachable
    hostname: my-rpi5.local    # optional mDNS/DNS name; access fallback when ip is unset
    ssh_user: pi

  # Node connected via USB ethernet gadget (no direct GbE/WiFi)
  my_pizero_node:
    wifi_ip:  192.168.1.200    # WiFi address for direct SSH
    ssh_user: pi
    connection:
      via:    usb_gadget
      host:   my_sbc_node      # reaches this node through its host's USB interface
      usb_ip: 192.168.8.2      # IP on the USB gadget network

  # Hub or inference node
  my_hub_node:
    ip:       192.168.1.130
    ssh_user: root
