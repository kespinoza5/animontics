site_name: Animontics
site_description: Distributed sensor infrastructure for an embodied AI system
repo_url: https://github.com/your-org/animontics

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

hooks:
  - mkdocs_hooks.py

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Cortex Runtime: cortex.md
  - Firmware & Targets (forge): forge.md
  - Configuration: config.md
  - Sensors:
    - Overview: sensors/index.md
    - TF Mini Plus LiDAR: sensors/tf_mini.md
    - LV-MaxSonar-EZ: sensors/lv_maxsonar.md
    - VL53L1X Time-of-Flight: sensors/vl53l1x.md
    - MLX90640 Thermal: sensors/mlx90640.md
    - IR Transceiver: sensors/ir_xcvr.md
    - MQ Gas Array: sensors/mq_array.md
    - Pressure Array: sensors/pressure_array.md
    - Analog In (ADS1115): sensors/analog_in.md
    - Board Temperature: sensors/board_temp.md
    - Fan Tach (RPM): sensors/fan_tach.md
  - Node Agent: node.md
  - Core Library: core.md
  - Tools:
    - Overview: tools/index.md
    - Fleet CLI (animon): tools/fleet.md
    - Firmware (forge): tools/forge.md
    - Board Setup & Comms: tools/board.md
    - SSH Access: tools/ssh.md
    - Network (AP): tools/network.md
    - USB Gadget: tools/usb.md
    - USB Port (usbport): tools/usbport.md
  - API Reference:
    - core: api/core.md
    - sensors: api/sensors.md
    - effectors: api/effectors.md
    - policies: api/policies.md
    - node: api/node.md
  - Contributing: contributing.md
  - Roadmap: roadmap.md

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: ignore

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
