<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLX90640 Thermal Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
    padding: 24px;
  }

  h1 {
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #555;
    font-weight: normal;
  }

  #host-bar { display: flex; gap: 8px; align-items: center; }

  #host-bar input {
    background: #111;
    border: 1px solid #333;
    color: #ccc;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 4px;
    width: 280px;
    outline: none;
  }
  #host-bar input:focus { border-color: #555; }

  #host-bar button, .btn {
    background: #1a1a2e;
    border: 1px solid #333;
    color: #88aaff;
    font-family: inherit;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .btn:hover, #host-bar button:hover { background: #22224a; }
  .btn.active { border-color: #88aaff; color: #aaccff; }

  /* Auto-scale active state — teal accent throughout range row */
  .auto-active { border-color: #22aaaa !important; color: #66dddd !important; }
  #auto-btn.auto-active {
    background: #0d2222;
    border-color: #22aaaa;
    color: #44dddd;
    box-shadow: 0 0 6px rgba(34,170,170,0.4);
  }

  #canvas-wrap { position: relative; }
  canvas { display: block; border-radius: 4px; }
  #crosshair { position: absolute; top: 0; left: 0; pointer-events: none; }

  #stats {
    display: flex;
    gap: 32px;
    font-size: 12px;
    letter-spacing: 0.08em;
    align-items: center;
  }

  .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .stat-label { color: #444; font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; }
  .stat-val { font-size: 22px; font-weight: bold; }
  .stat-val.cold   { color: #4488ff; }
  .stat-val.hot    { color: #ff5533; }
  .stat-val.cursor { color: #ffcc44; }

  #fps-box { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-left: 8px; }
  #fps-label { color: #444; font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; }
  #fps-val   { font-size: 14px; color: #336644; }

  #range-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: #666;
  }
  #range-row input[type=number] {
    background: #111;
    border: 1px solid #333;
    color: #ccc;
    font-family: inherit;
    font-size: 13px;
    padding: 5px 8px;
    border-radius: 4px;
    width: 72px;
    outline: none;
    text-align: center;
    transition: border-color 0.15s, color 0.15s;
  }
  #range-row input:focus:not(.auto-active) { border-color: #555; }
  #range-row label { color: #555; font-size: 11px; letter-spacing: 0.1em; }


  #smooth-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: #555;
    letter-spacing: 0.1em;
  }
  #smooth-row input[type=range] { accent-color: #88aaff; width: 130px; }
  #smooth-val { color: #667; min-width: 28px; text-align: right; }

  #colorbar-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: #555;
  }
  #colorbar { width: 240px; height: 10px; border-radius: 2px; }

  #palette-row { display: flex; gap: 8px; }

  #status { font-size: 11px; color: #333; letter-spacing: 0.1em; }
  #status.ok  { color: #336644; }
  #status.err { color: #662222; }
</style>
</head>
<body>

<h1>MLX90640 · thermal viewer</h1>

<div id="host-bar">
  <input id="host-input" value="ws://192.168.1.140:5001">
  <button onclick="connect()">connect</button>
</div>

<div id="canvas-wrap">
  <canvas id="thermal" width="512" height="384"></canvas>
  <canvas id="crosshair" width="512" height="384"></canvas>
</div>

<div id="stats">
  <div class="stat">
    <span class="stat-label">min</span>
    <span class="stat-val cold" id="val-min">--.-</span>
  </div>
  <div class="stat">
    <span class="stat-label">cursor</span>
    <span class="stat-val cursor" id="val-cur">--.-</span>
  </div>
  <div class="stat">
    <span class="stat-label">max</span>
    <span class="stat-val hot" id="val-max">--.-</span>
  </div>
  <div id="fps-box">
    <span id="fps-label">fps</span>
    <span id="fps-val">--</span>
  </div>
</div>

<div id="range-row">
  <label>RANGE</label>
  <input type="number" id="range-min" value="32" step="0.5"> °C
  <span style="color:#333">—</span>
  <input type="number" id="range-max" value="40" step="0.5"> °C
  <button class="btn" id="auto-btn" onclick="toggleAuto()">auto</button>
  <button class="btn" onclick="snapToScene()">snap</button>
</div>

<!-- Smoothing: slider 0 = raw sensor, 1 = heavily averaged. Internal alpha = 1 - sliderValue -->
<div id="smooth-row">
  <label>DENOISE</label>
  <input type="range" id="smooth-slider" min="0" max="1" step="0.01" value="0.15"
         oninput="onSmoothChange(this.value)">
  <span id="smooth-val">0.15</span>
  <label style="color:#444; font-size:10px;">(0 = raw · 1 = max)</label>
</div>

<div id="colorbar-wrap">
  <span id="cb-min">32°C</span>
  <canvas id="colorbar"></canvas>
  <span id="cb-max">40°C</span>
</div>

<div id="palette-row">
  <button class="btn active" onclick="setPalette('ironbow')">ironbow</button>
  <button class="btn" onclick="setPalette('inferno')">inferno</button>
  <button class="btn" onclick="setPalette('hot')">hot</button>
  <button class="btn" onclick="setPalette('rainbow')">rainbow</button>
  <button class="btn" onclick="setPalette('greyscale')">greyscale</button>
  <span style="color:#333; margin: 0 4px;">|</span>
  <button class="btn active" id="interp-btn" onclick="toggleInterp()">interp</button>
</div>

<div id="status">disconnected</div>

<script>
// ── Palettes & LUT ────────────────────────────────────────────────────────────

const PALETTES = {
  ironbow:  [[0,0,0],[32,0,48],[64,0,128],[128,0,96],[192,32,0],[255,128,0],[255,224,64],[255,255,192],[255,255,255]],
  inferno:  [[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[252,193,69],[252,255,164]],
  hot:      [[0,0,0],[192,0,0],[255,64,0],[255,192,0],[255,255,128],[255,255,255]],
  rainbow:  [[0,0,128],[0,0,255],[0,128,255],[0,255,255],[0,255,0],[255,255,0],[255,128,0],[255,0,0],[128,0,0]],
  greyscale:[[0,0,0],[255,255,255]],
};

let currentPalette = 'ironbow';
let autoScale = false;

function lerpColor(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const n = stops.length - 1;
  const i = Math.floor(t * n);
  const f = t * n - i;
  const a = stops[Math.min(i, n)], b = stops[Math.min(i+1, n)];
  return [
    Math.round(a[0] + (b[0]-a[0])*f),
    Math.round(a[1] + (b[1]-a[1])*f),
    Math.round(a[2] + (b[2]-a[2])*f),
  ];
}

const LUT_SIZE = 1024;
const colorLUT = new Uint8Array(LUT_SIZE * 3);

function buildLUT(stops) {
  for (let i = 0; i < LUT_SIZE; i++) {
    const [r,g,b] = lerpColor(stops, i / (LUT_SIZE - 1));
    colorLUT[i*3] = r; colorLUT[i*3+1] = g; colorLUT[i*3+2] = b;
  }
}
buildLUT(PALETTES[currentPalette]);

function setPalette(name) {
  currentPalette = name;
  buildLUT(PALETTES[name]);
  document.querySelectorAll('#palette-row .btn').forEach(b => {
    b.classList.toggle('active', b.textContent === name);
  });
  drawColorbar();
  needsRender = true;
}

function setAutoUI(on) {
  const btn   = document.getElementById('auto-btn');
  const rMin  = document.getElementById('range-min');
  const rMax  = document.getElementById('range-max');
  btn.classList.toggle('active', on);
  btn.classList.toggle('auto-active', on);
  rMin.classList.toggle('auto-active', on);
  rMax.classList.toggle('auto-active', on);
  rMin.disabled = on;
  rMax.disabled = on;
}

function toggleAuto() {
  autoScale = !autoScale;
  setAutoUI(autoScale);
  if (autoScale) { updateColorbarLabels(); drawColorbar(); needsRender = true; }
}

function snapToScene() {
  if (!smoothedPixels) return;
  document.getElementById('range-min').value = lastSceneMin.toFixed(1);
  document.getElementById('range-max').value = lastSceneMax.toFixed(1);
  autoScale = false;
  setAutoUI(false);
  needsRender = true;
  drawColorbar();
  updateColorbarLabels();
}

function getRangeMin() { return parseFloat(document.getElementById('range-min').value); }
function getRangeMax() { return parseFloat(document.getElementById('range-max').value); }

// ── Canvas & bilinear tables ──────────────────────────────────────────────────

const COLS = 32, ROWS = 24;
const canvas = document.getElementById('thermal');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const SCALEX = W / COLS, SCALEY = H / ROWS;

const crossCanvas = document.getElementById('crosshair');
const cx = crossCanvas.getContext('2d');

// Offscreen 32×24 canvas used for nearest-neighbour (pixel) mode.
const offscreen = document.createElement('canvas');
offscreen.width  = COLS;
offscreen.height = ROWS;
const offCtx = offscreen.getContext('2d');

// Precompute per-output-column source indices and weights (horizontal mirror included).
// This runs once; the inner render loop reuses these arrays every frame.
const xSrc0 = new Uint8Array(W);
const xSrc1 = new Uint8Array(W);
const xWgt0 = new Float32Array(W);   // weight for xSrc0
const xWgt1 = new Float32Array(W);   // weight for xSrc1
(function buildXTable() {
  for (let px = 0; px < W; px++) {
    const fx = (1 - px / (W - 1)) * (COLS - 1);   // mirror
    const x0 = fx | 0;
    xSrc0[px] = x0;
    xSrc1[px] = Math.min(x0 + 1, COLS - 1);
    xWgt1[px] = fx - x0;
    xWgt0[px] = 1 - xWgt1[px];
  }
})();

// ── State ─────────────────────────────────────────────────────────────────────

let smoothedPixels = null;   // Float32Array, sensor-space (unmirrored)
// Slider 0 = raw (internal alpha=1.0), slider 1 = max smooth (alpha≈0).
let smoothAlpha  = 0.85;
let lastSceneMin = 32, lastSceneMax = 40;
let needsRender  = false;
let lastFrameId  = -1;
let interpolate  = true;

function toggleInterp() {
  interpolate = !interpolate;
  document.getElementById('interp-btn').classList.toggle('active', interpolate);
  needsRender = true;
}

function onSmoothChange(v) {
  smoothAlpha = 1.0 - parseFloat(v);
  document.getElementById('smooth-val').textContent = parseFloat(v).toFixed(2);
}

function applySmoothing(newPixels) {
  if (!smoothedPixels) {
    smoothedPixels = new Float32Array(newPixels);
    return;
  }
  const alpha = smoothAlpha, inv = 1 - alpha;
  for (let i = 0; i < 768; i++) {
    smoothedPixels[i] = alpha * newPixels[i] + inv * smoothedPixels[i];
  }
}

// ── Render ────────────────────────────────────────────────────────────────────

function redraw() {
  if (!smoothedPixels) return;
  const mn    = autoScale ? lastSceneMin : getRangeMin();
  const mx    = autoScale ? lastSceneMax : getRangeMax();
  const range = mx - mn || 1;
  const scale = (LUT_SIZE - 1) / range;

  if (interpolate) {
    // Temperature-space bilinear: interpolate °C values first, then colour-map.
    // Prevents colour-space artefacts (e.g. purple between red and blue regions).
    const imgData = ctx.createImageData(W, H);
    const d = imgData.data;

    for (let py = 0; py < H; py++) {
      const fy   = py / (H - 1) * (ROWS - 1);
      const y0   = fy | 0;
      const y1   = Math.min(y0 + 1, ROWS - 1);
      const wy1  = fy - y0;
      const wy0  = 1 - wy1;
      const row0 = y0 * COLS;
      const row1 = y1 * COLS;
      let   idx  = py * W * 4;

      for (let px = 0; px < W; px++) {
        const s0 = xSrc0[px], s1 = xSrc1[px];
        const w0 = xWgt0[px], w1 = xWgt1[px];
        const temp = smoothedPixels[row0 + s0] * wy0 * w0
                   + smoothedPixels[row0 + s1] * wy0 * w1
                   + smoothedPixels[row1 + s0] * wy1 * w0
                   + smoothedPixels[row1 + s1] * wy1 * w1;
        const lut = Math.min(LUT_SIZE - 1, Math.max(0, (temp - mn) * scale | 0)) * 3;
        d[idx]   = colorLUT[lut];
        d[idx+1] = colorLUT[lut+1];
        d[idx+2] = colorLUT[lut+2];
        d[idx+3] = 255;
        idx += 4;
      }
    }
    ctx.putImageData(imgData, 0, 0);

  } else {
    // Pixel mode: write the 32×24 sensor pixels to the offscreen canvas then
    // scale up with nearest-neighbour so each block is a single exact reading.
    const imgData = offCtx.createImageData(COLS, ROWS);
    const d = imgData.data;
    for (let i = 0; i < 768; i++) {
      const row = (i / COLS) | 0;
      const col = i % COLS;
      const dst = (row * COLS + (COLS - 1 - col)) << 2;   // mirror
      const lut = Math.min(LUT_SIZE - 1, Math.max(0, (smoothedPixels[i] - mn) * scale | 0)) * 3;
      d[dst]   = colorLUT[lut];
      d[dst+1] = colorLUT[lut+1];
      d[dst+2] = colorLUT[lut+2];
      d[dst+3] = 255;
    }
    offCtx.putImageData(imgData, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(offscreen, 0, 0, W, H);
  }
}

// ── RAF render loop ───────────────────────────────────────────────────────────

let fpsCount = 0, fpsTimestamp = 0;

function renderLoop(ts) {
  if (needsRender) {
    needsRender = false;
    redraw();
    fpsCount++;
  }
  if (ts - fpsTimestamp >= 1000) {
    document.getElementById('fps-val').textContent = fpsCount;
    fpsCount = 0; fpsTimestamp = ts;
  }
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

// ── Crosshair ─────────────────────────────────────────────────────────────────

let cursorCol = -1, cursorRow = -1;

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const col  = COLS - 1 - Math.floor((e.clientX - rect.left) / SCALEX);
  const row  = Math.floor((e.clientY - rect.top) / SCALEY);
  if (col >= 0 && col < COLS && row >= 0 && row < ROWS && smoothedPixels) {
    cursorCol = col; cursorRow = row;
    updateCursorTemp();
    drawCrosshair();
  }
});

canvas.addEventListener('mouseleave', () => {
  cursorCol = -1;
  document.getElementById('val-cur').textContent = '--.-';
  cx.clearRect(0, 0, crossCanvas.width, crossCanvas.height);
});

function updateCursorTemp() {
  if (cursorCol < 0 || !smoothedPixels) return;
  const temp = smoothedPixels[cursorRow * COLS + (COLS - 1 - cursorCol)];
  document.getElementById('val-cur').textContent = temp.toFixed(1) + '°';
}

function drawCrosshair() {
  cx.clearRect(0, 0, crossCanvas.width, crossCanvas.height);
  if (cursorCol < 0) return;
  const x = (COLS - 1 - cursorCol + 0.5) * SCALEX;
  const y = (cursorRow + 0.5) * SCALEY;
  const s = 12;
  cx.strokeStyle = 'rgba(255,204,68,0.85)'; cx.lineWidth = 1.5;
  cx.beginPath();
  cx.moveTo(x-s,y); cx.lineTo(x+s,y);
  cx.moveTo(x,y-s); cx.lineTo(x,y+s);
  cx.stroke();
  cx.strokeStyle = 'rgba(255,204,68,0.3)'; cx.lineWidth = 1;
  cx.beginPath(); cx.arc(x, y, 16, 0, Math.PI*2); cx.stroke();
}

// ── Colorbar ──────────────────────────────────────────────────────────────────

function drawColorbar() {
  const bar = document.getElementById('colorbar');
  bar.width = 240; bar.height = 10;
  const bctx = bar.getContext('2d');
  for (let x = 0; x < 240; x++) {
    const [r,g,b] = lerpColor(PALETTES[currentPalette], x/239);
    bctx.fillStyle = `rgb(${r},${g},${b})`;
    bctx.fillRect(x, 0, 1, 10);
  }
}
drawColorbar();

function updateColorbarLabels() {
  const mn = autoScale ? lastSceneMin : getRangeMin();
  const mx = autoScale ? lastSceneMax : getRangeMax();
  document.getElementById('cb-min').textContent = mn.toFixed(0) + '°C';
  document.getElementById('cb-max').textContent = mx.toFixed(0) + '°C';
}
updateColorbarLabels();

document.getElementById('range-min').addEventListener('input', () => { needsRender = true; drawColorbar(); updateColorbarLabels(); });
document.getElementById('range-max').addEventListener('input', () => { needsRender = true; drawColorbar(); updateColorbarLabels(); });

// ── WebSocket ─────────────────────────────────────────────────────────────────
// Binary frame (little-endian):
//   [0]  uint32  frame_id
//   [4]  float32 min_temp
//   [8]  float32 max_temp
//   [12] float32 × 768  pixels

let ws = null, reconnectTimer = null, intentionalClose = false;

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = cls || '';
}

function connect() {
  intentionalClose = true;
  if (ws) ws.close();
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  const url = document.getElementById('host-input').value.replace(/\/$/, '');
  intentionalClose = false;
  lastFrameId = -1;
  setStatus('connecting…');
  openWS(url);
}

function openWS(url) {
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => setStatus('● live', 'ok');

  ws.onmessage = e => {
    const buf  = e.data;
    const view = new DataView(buf);
    const id   = view.getUint32(0, true);
    if (id === lastFrameId) return;
    lastFrameId = id;

    const mn     = view.getFloat32(4, true);
    const mx     = view.getFloat32(8, true);
    const pixels = new Float32Array(buf, 12, 768);

    lastSceneMin = mn;
    lastSceneMax = mx;
    applySmoothing(pixels);

    document.getElementById('val-min').textContent = mn.toFixed(1) + '°';
    document.getElementById('val-max').textContent = mx.toFixed(1) + '°';

    if (autoScale) {
      // Mirror live scene range into the (disabled) inputs so the user can
      // see exactly what range is active and use snap to lock it in.
      document.getElementById('range-min').value = mn.toFixed(1);
      document.getElementById('range-max').value = mx.toFixed(1);
      updateColorbarLabels();
      drawColorbar();
    }

    updateCursorTemp();
    needsRender = true;
    setStatus('● live', 'ok');
  };

  ws.onerror = () => setStatus('✕ connection error', 'err');

  ws.onclose = () => {
    if (intentionalClose) return;
    setStatus('disconnected — reconnecting…', 'err');
    reconnectTimer = setTimeout(() => { reconnectTimer = null; openWS(url); }, 2000);
  };
}

connect();
</script>
</body>
</html>
