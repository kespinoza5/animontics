<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TF Mini Plus</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="../shared/viewer.css" />
</head>
<body>
  <h1>TF Mini Plus &mdash; Distance</h1>

  <div class="readout">
    <div class="main-val">
      <span class="value" id="val">—</span>
      <span class="unit" id="unit">m</span>
    </div>
    <div class="meta">
      <span id="strength">strength: —</span>
      <span id="temp">temp: —</span>
    </div>
  </div>

  <button class="btn" id="toggle">Switch to ft / in</button>

  <div class="chart-wrap"><canvas id="chart"></canvas></div>

  <div class="bottom-bar">
    <div class="conn-bar">
      <label for="ip">Host IP</label>
      <input id="ip" type="text" value="192.168.1.x" spellcheck="false" />
      <input id="sid" type="text" value="lidar_front" style="width:11ch"
             spellcheck="false" title="Sensor ID" />
      <button class="btn" id="reconnect">Connect</button>
    </div>
    <span class="status" id="status">connecting…</span>
  </div>

<script src="../shared/stream.js"></script>
<script src="../shared/timeseries.js"></script>
<script>
  // ── Per-sensor config ───────────────────────────────────────────────────────
  const M_MAX  = 12;                              // metres (full TF Mini Plus range)
  const FT_MAX = +(M_MAX * 3.28084).toFixed(1);

  let useMetric = true;
  let lastMm = null;

  const valEl      = document.getElementById("val");
  const unitEl     = document.getElementById("unit");
  const strengthEl = document.getElementById("strength");
  const tempEl     = document.getElementById("temp");

  const chart = AnimChart.makeLine(document.getElementById("chart"), {
    color: "#58a6ff",
    max: M_MAX,
    tickFmt: (v) => v + (useMetric ? " m" : " ft"),
    tipFmt: (v) => useMetric ? v.toFixed(3) + " m" : v.toFixed(2) + " ft",
  });

  function updateReadout(mm) {
    if (useMetric) {
      const m = mm / 1000;
      valEl.textContent = m < 10 ? m.toFixed(3) : m.toFixed(2);
      unitEl.textContent = "m";
    } else {
      valEl.textContent = (mm / 304.8).toFixed(2);
      unitEl.textContent = "ft";
    }
    valEl.classList.remove("warn", "close");
    if (mm < 300)       valEl.classList.add("close");
    else if (mm < 1000) valEl.classList.add("warn");
  }

  document.getElementById("toggle").addEventListener("click", () => {
    useMetric = !useMetric;
    document.getElementById("toggle").textContent =
      useMetric ? "Switch to ft / in" : "Switch to m / cm";
    chart.setMax(useMetric ? M_MAX : FT_MAX);
    chart.setFormatters();   // formatters close over useMetric — refresh ticks
    chart.clear();           // stored values were in the old unit
    if (lastMm !== null) updateReadout(lastMm);
  });

  // ── Connection ──────────────────────────────────────────────────────────────
  let conn = null;
  function start() {
    if (conn) conn.close();
    conn = AnimStream.connect({
      hostInput: document.getElementById("ip"),
      sensorId: document.getElementById("sid").value.trim(),
      onStatus: (text, cls) => {
        const s = document.getElementById("status");
        s.textContent = text; s.className = "status " + cls;
      },
      onReading: (d) => {
        if (d.distance_mm == null) return;
        lastMm = d.distance_mm;
        updateReadout(d.distance_mm);
        chart.push(useMetric ? d.distance_mm / 1000 : d.distance_mm / 304.8);
        if (d.strength != null) strengthEl.textContent = `strength: ${d.strength}`;
        if (d.temp_c != null) {
          const f = (d.temp_c * 9 / 5 + 32).toFixed(1);
          tempEl.textContent = `temp: ${d.temp_c.toFixed(1)} °C / ${f} °F`;
        }
      },
    });
  }

  document.getElementById("reconnect").addEventListener("click", start);
  start();
</script>
</body>
</html>
