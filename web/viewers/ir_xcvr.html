<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IR Transceiver</title>
  <link rel="stylesheet" href="../shared/viewer.css" />
  <style>
    /* ir_xcvr-specific components — the event-log archetype. Base shell
       (body / h1 / btn / conn-bar / status / bottom-bar) comes from viewer.css. */

    /* This viewer scrolls its log internally; allow the page to use full height. */
    body { overflow: hidden; }

    .last-code {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      width: 100%;
      max-width: 700px;
      flex-shrink: 0;
    }

    .tile {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .tile-label {
      font-size: 0.7rem;
      color: #484f58;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tile-value {
      font-size: 1.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #58a6ff;
      font-family: monospace;
    }
    .tile-value.repeat { color: #f0883e; }
    .tile-value.none   { color: #484f58; }

    /* ── TX panel ── */
    .tx-panel {
      width: 100%;
      max-width: 700px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      flex-shrink: 0;
    }

    .tx-panel h2 {
      font-size: 0.75rem;
      font-weight: 500;
      color: #8b949e;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .tx-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .tx-row label { font-size: 0.8rem; color: #8b949e; white-space: nowrap; }

    .tx-row input, .tx-row select {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: monospace;
      width: 9ch;
    }
    .tx-row input:focus, .tx-row select:focus { outline: none; border-color: #58a6ff; }
    .tx-row select { width: auto; }

    .tx-result { margin-top: 0.5rem; font-size: 0.8rem; min-height: 1.1rem; font-family: monospace; }
    .tx-result.ok  { color: #3fb950; }
    .tx-result.err { color: #f85149; }

    /* ── Log ── */
    .log-wrap {
      flex: 1;
      width: 100%;
      max-width: 700px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.9rem;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
    }
    .log-header span {
      font-size: 0.75rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .log-body { overflow-y: auto; flex: 1; padding: 0.4rem 0; font-family: monospace; font-size: 0.82rem; }

    .log-row {
      display: grid;
      grid-template-columns: 6.5rem 4.5rem 6rem 6rem 5.5rem 1fr;
      padding: 0.22rem 0.9rem;
      gap: 0.5rem;
      border-bottom: 1px solid #161b22;
      transition: background 0.1s;
    }
    .log-row:hover { background: #1c2128; }
    .log-row.repeat { opacity: 0.55; }

    .col-time  { color: #484f58; }
    .col-proto { color: #d2a8ff; }
    .col-addr  { color: #79c0ff; }
    .col-cmd   { color: #56d364; }
    .col-sc    { color: #8b949e; }
    .col-flag  { color: #f0883e; font-size: 0.72rem; }

    /* TX accent button + tighten the connection bar to match the 700px panels. */
    .btn.accent { border-color: #388bfd; color: #58a6ff; }
    .btn.accent:hover { background: #1f3250; }
    .bottom-bar { max-width: 700px; }

    .cap-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      border: 1px solid #30363d;
      color: #8b949e;
    }
    .cap-badge.on  { border-color: #3fb950; color: #3fb950; }
    .cap-badge.off { border-color: #484f58; color: #484f58; }
  </style>
</head>
<body>
  <h1>IR Transceiver &mdash; ir_xcvr</h1>

  <!-- Last received code -->
  <div class="last-code">
    <div class="tile">
      <div class="tile-label">Protocol</div>
      <div class="tile-value none" id="last-proto">—</div>
    </div>
    <div class="tile">
      <div class="tile-label">Address</div>
      <div class="tile-value none" id="last-addr">—</div>
    </div>
    <div class="tile">
      <div class="tile-label">Command</div>
      <div class="tile-value none" id="last-cmd">—</div>
    </div>
  </div>

  <!-- TX panel -->
  <div class="tx-panel">
    <h2>Transmit</h2>
    <div class="tx-row">
      <label>Protocol</label>
      <select id="tx-proto">
        <option value="NEC">NEC</option>
        <option value="NECX">NECX</option>
      </select>
      <label>Address (hex)</label>
      <input id="tx-addr" type="text" value="0x04" spellcheck="false" />
      <label>Command (hex)</label>
      <input id="tx-cmd"  type="text" value="0x08" spellcheck="false" />
      <button class="btn accent" id="tx-send">Send</button>
    </div>
    <div class="tx-result" id="tx-result"></div>
  </div>

  <!-- Code log -->
  <div class="log-wrap">
    <div class="log-header">
      <span>Received codes</span>
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <span class="cap-badge" id="badge-rx">RX —</span>
        <span class="cap-badge" id="badge-tx">TX —</span>
        <button class="btn" id="clear-log">Clear</button>
      </div>
    </div>
    <div class="log-body" id="log-body"><!-- rows injected here --></div>
  </div>

  <!-- Connection bar -->
  <div class="bottom-bar">
    <div class="conn-bar">
      <label for="ip">Host IP</label>
      <input id="ip" type="text" value="192.168.1.x" spellcheck="false" />
      <input id="sid" type="text" value="ir_xcvr"
             style="width:10ch" spellcheck="false" title="Sensor ID" />
      <button class="btn" id="reconnect">Connect</button>
    </div>
    <span class="status" id="status">connecting…</span>
  </div>

<script src="../shared/stream.js"></script>
<script>
  const MAX_LOG = 120;
  const PORT = AnimStream.DEFAULT_PORT;

  const lastProto = document.getElementById('last-proto');
  const lastAddr  = document.getElementById('last-addr');
  const lastCmd   = document.getElementById('last-cmd');
  const logBody   = document.getElementById('log-body');
  const txResult  = document.getElementById('tx-result');
  const badgeRx   = document.getElementById('badge-rx');
  const badgeTx   = document.getElementById('badge-tx');

  const fmtHex2 = (n) => '0x' + n.toString(16).toUpperCase().padStart(2, '0');
  const fmtHex4 = (n) => '0x' + n.toString(16).toUpperCase().padStart(4, '0');
  const fmtHex6 = (n) => '0x' + n.toString(16).toUpperCase().padStart(6, '0');
  function fmtTime(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('en', { hour12: false }) +
           '.' + String(d.getMilliseconds()).padStart(3, '0');
  }

  function updateLastCode(d) {
    lastProto.textContent = d.protocol;
    lastProto.className   = 'tile-value' + (d.repeat ? ' repeat' : '');
    lastAddr.textContent  = fmtHex4(d.address);
    lastAddr.className     = 'tile-value';
    lastCmd.textContent    = fmtHex2(d.command);
    lastCmd.className       = 'tile-value';
  }

  function appendLog(ts, d) {
    const row = document.createElement('div');
    row.className = 'log-row' + (d.repeat ? ' repeat' : '');
    row.innerHTML =
      `<span class="col-time">${fmtTime(ts)}</span>` +
      `<span class="col-proto">${d.protocol}</span>` +
      `<span class="col-addr">${fmtHex4(d.address)}</span>` +
      `<span class="col-cmd">${fmtHex2(d.command)}</span>` +
      `<span class="col-sc">${fmtHex6(d.scancode)}</span>` +
      `<span class="col-flag">${d.repeat ? 'repeat' : ''}</span>`;
    logBody.prepend(row);
    while (logBody.children.length > MAX_LOG) logBody.removeChild(logBody.lastChild);
  }

  document.getElementById('clear-log').addEventListener('click', () => {
    logBody.innerHTML = '';
    lastProto.textContent = '—'; lastProto.className = 'tile-value none';
    lastAddr.textContent  = '—'; lastAddr.className  = 'tile-value none';
    lastCmd.textContent   = '—'; lastCmd.className   = 'tile-value none';
  });

  // ── Capabilities ────────────────────────────────────────────────────────────
  function host() { return document.getElementById('ip').value.trim(); }

  function fetchCapabilities() {
    fetch(`http://${host()}:${PORT}/ir/capabilities`)
      .then(r => r.json())
      .then(data => {
        badgeRx.textContent = 'RX ' + (data.can_receive  ? '✓' : '✗');
        badgeRx.className   = 'cap-badge ' + (data.can_receive  ? 'on' : 'off');
        badgeTx.textContent = 'TX ' + (data.can_transmit ? '✓' : '✗');
        badgeTx.className   = 'cap-badge ' + (data.can_transmit ? 'on' : 'off');
      })
      .catch(() => {
        badgeRx.textContent = 'RX —'; badgeRx.className = 'cap-badge';
        badgeTx.textContent = 'TX —'; badgeTx.className = 'cap-badge';
      });
  }

  // ── TX ──────────────────────────────────────────────────────────────────────
  document.getElementById('tx-send').addEventListener('click', () => {
    const protocol = document.getElementById('tx-proto').value;
    const addrRaw  = document.getElementById('tx-addr').value.trim();
    const cmdRaw   = document.getElementById('tx-cmd').value.trim();

    const address = parseInt(addrRaw, addrRaw.startsWith('0x') ? 16 : 10);
    const command = parseInt(cmdRaw,  cmdRaw.startsWith('0x')  ? 16 : 10);
    if (Number.isNaN(address) || Number.isNaN(command)) {
      txResult.textContent = '✗  Invalid address or command';
      txResult.className   = 'tx-result err';
      return;
    }

    txResult.textContent = '…  sending';
    txResult.className   = 'tx-result';

    fetch(`http://${host()}:${PORT}/ir/transmit`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ protocol, address, command }),
    })
    .then(r => r.json().then(j => ({ ok: r.ok, body: j })))
    .then(({ ok, body }) => {
      if (ok) {
        txResult.textContent = `✓  Sent ${body.protocol}  addr=${fmtHex4(body.address)}  cmd=${fmtHex2(body.command)}`;
        txResult.className   = 'tx-result ok';
      } else {
        txResult.textContent = `✗  ${body.detail || 'Error'}`;
        txResult.className   = 'tx-result err';
      }
    })
    .catch(err => {
      txResult.textContent = `✗  ${err.message}`;
      txResult.className   = 'tx-result err';
    });
  });

  // ── Connection (shared AnimStream) ───────────────────────────────────────────
  let conn = null;
  function start() {
    if (conn) conn.close();
    fetchCapabilities();
    conn = AnimStream.connect({
      hostInput: document.getElementById('ip'),
      sensorId: document.getElementById('sid').value.trim(),
      onStatus: (text, cls) => {
        const s = document.getElementById('status');
        s.textContent = text; s.className = 'status ' + cls;
        if (cls === 'ok') fetchCapabilities();   // refresh badges on (re)connect
      },
      onReading: (d, reading) => {
        if (!d) return;
        updateLastCode(d);
        appendLog(reading.timestamp, d);
      },
    });
  }

  document.getElementById('reconnect').addEventListener('click', start);
  start();
</script>
</body>
</html>
