<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servo Feedback</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="../shared/viewer.css" />
  <style>
    /* Viewer-specific: one card per joint — angle dial + rolling history. */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      margin: 12px 0;
    }
    .card {
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 12px;
      background: #0d1117;
    }
    .card .sig { font-size: 0.85rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.04em; }
    .card .deg { font-size: 1.9rem; font-weight: 600; }
    .card .raw { font-size: 0.8rem; color: #58a6ff; min-height: 1em; }
    .card .dial { height: 8px; border-radius: 4px; background: #21262d; margin: 8px 0 4px; position: relative; }
    .card .dial .fill { height: 100%; border-radius: 4px; background: #ffcc44; width: 0%; transition: width 0.1s linear; }
    .card canvas { margin-top: 6px; }
    #seq { color: #8b949e; }
  </style>
</head>
<body>
  <h1>Servo Feedback · proprioception</h1>
  <div class="meta"><span id="seq">seq: —</span></div>

  <div class="grid" id="grid"></div>

  <div class="bottom-bar">
    <div class="conn-bar">
      <label for="ip">Host IP</label>
      <input id="ip" type="text" value="192.168.1.x" spellcheck="false" />
      <input id="sid" type="text" value="neck_feedback" style="width:13ch"
             spellcheck="false" title="Sensor ID" />
      <button class="btn" id="reconnect">Connect</button>
    </div>
    <span class="status" id="status">connecting…</span>
  </div>

<script src="../shared/stream.js"></script>
<script src="../shared/timeseries.js"></script>
<script>
  // Joints are discovered from the stream: data.raw is keyed by joint signal
  // (yaw, pitch, ear_left, …); data.deg appears for servo_pot-calibrated
  // channels. One card per signal: live angle, dial (0–180°), raw counts, and
  // a rolling angle history.
  const DEG_MAX = 180;
  const gridEl = document.getElementById("grid");
  const cards = {};   // signal → { degEl, rawEl, fillEl, chart }

  function cardFor(signal) {
    if (cards[signal]) return cards[signal];
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML =
      `<div class="sig">${signal}</div>` +
      `<div class="deg">—</div>` +
      `<div class="dial"><div class="fill"></div></div>` +
      `<div class="raw"></div>` +
      `<canvas height="60"></canvas>`;
    gridEl.appendChild(el);
    const chart = AnimChart.makeLine(el.querySelector("canvas"), {
      color: "#ffcc44",
      max: DEG_MAX,
      history: 240,
      tickFmt: (v) => v + "°",
      tipFmt: (v) => v + "°",
    });
    return (cards[signal] = {
      degEl: el.querySelector(".deg"),
      rawEl: el.querySelector(".raw"),
      fillEl: el.querySelector(".fill"),
      chart,
    });
  }

  let conn = null;
  function start() {
    if (conn) conn.close();
    conn = AnimStream.connect({
      hostInput: document.getElementById("ip"),
      sensorId: document.getElementById("sid").value.trim(),
      onStatus: (text, cls) => {
        const s = document.getElementById("status");
        s.textContent = text; s.className = "status " + (cls || "");
      },
      onReading: (d) => {
        if (d.seq != null) document.getElementById("seq").textContent = `seq: ${d.seq}`;
        const deg = d.deg || {};
        for (const [signal, raw] of Object.entries(d.raw || {})) {
          const c = cardFor(signal);
          c.rawEl.textContent = "raw " + raw;
          if (signal in deg) {
            c.degEl.textContent = deg[signal].toFixed(1) + "°";
            c.fillEl.style.width = (100 * deg[signal] / DEG_MAX).toFixed(1) + "%";
            c.chart.push(deg[signal]);
          } else {
            c.degEl.textContent = "uncal";
            c.chart.push(raw);
          }
        }
      },
    });
  }

  document.getElementById("reconnect").addEventListener("click", start);
  start();
</script>
</body>
</html>
