<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LV-MaxSonar-EZ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding: 0.75rem 1.25rem;
      gap: 0.6rem;
    }

    h1 {
      font-size: 0.8rem;
      font-weight: 500;
      color: #8b949e;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .readout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      flex-shrink: 0;
    }

    .main-val {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }

    .value {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: #58a6ff;
      transition: color 0.2s;
    }

    .value.warn  { color: #f0883e; }
    .value.close { color: #f85149; }

    .unit {
      font-size: 1.4rem;
      color: #8b949e;
      font-weight: 400;
    }

    .meta {
      font-size: 0.8rem;
      color: #484f58;
    }

    .btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: #30363d; border-color: #8b949e; }

    .chart-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 860px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 0.9rem;
      position: relative;
    }

    .chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 860px;
      flex-shrink: 0;
      gap: 1rem;
    }

    .conn-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .conn-bar label {
      font-size: 0.8rem;
      color: #8b949e;
      white-space: nowrap;
    }

    .conn-bar input {
      background: #161b22;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: monospace;
      width: 17ch;
    }

    .conn-bar input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .status {
      font-size: 0.75rem;
      color: #484f58;
      white-space: nowrap;
    }
    .status.ok  { color: #3fb950; }
    .status.err { color: #f85149; }
  </style>
</head>
<body>
  <h1>LV-MaxSonar-EZ &mdash; Distance</h1>

  <div class="readout">
    <div class="main-val">
      <span class="value" id="val">—</span>
      <span class="unit" id="unit">m</span>
    </div>
    <div class="meta" id="alt">—</div>
  </div>

  <button class="btn" id="toggle">Switch to ft / in</button>

  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>

  <div class="bottom-bar">
    <div class="conn-bar">
      <label for="ip">Host IP</label>
      <input id="ip" type="text" value="192.168.1.37" spellcheck="false" />
      <button class="btn" id="reconnect">Connect</button>
    </div>
    <span class="status" id="status">connecting…</span>
  </div>

<script>
  const HISTORY  = 60;
  const CM_MAX   = 645;               // 254 in × 2.54
  const IN_MAX   = 254;
  let useMetric  = true;

  const valEl    = document.getElementById('val');
  const unitEl   = document.getElementById('unit');
  const altEl    = document.getElementById('alt');
  const statusEl = document.getElementById('status');
  const toggleBtn = document.getElementById('toggle');

  const data = Array(HISTORY).fill(null);

  const chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: Array(HISTORY).fill(''),
      datasets: [{
        data,
        borderColor: '#58a6ff',
        backgroundColor: 'rgba(88,166,255,0.08)',
        borderWidth: 2,
        pointRadius: 0,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { display: false },
        y: {
          min: 0,
          max: CM_MAX,
          ticks: { color: '#8b949e', callback: v => useMetric ? v + ' cm' : v + ' in' },
          grid: { color: '#21262d' },
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => useMetric
              ? ctx.parsed.y.toFixed(0) + ' cm'
              : ctx.parsed.y.toFixed(0) + ' in'
          }
        }
      }
    }
  });

  function cmToDisplay(cm) {
    if (useMetric) {
      if (cm >= 100) return { primary: (cm / 100).toFixed(2), unit: 'm', alt: cm + ' cm' };
      return { primary: cm.toFixed(0), unit: 'cm', alt: (cm / 100).toFixed(3) + ' m' };
    } else {
      const inches = cm / 2.54;
      if (inches >= 12) {
        const ft = Math.floor(inches / 12);
        const inn = (inches % 12).toFixed(1);
        return { primary: ft + "'" + inn + '"', unit: '', alt: inches.toFixed(1) + ' in' };
      }
      return { primary: inches.toFixed(1), unit: 'in', alt: (inches / 12).toFixed(2) + ' ft' };
    }
  }

  function updateReadout(cm) {
    const { primary, unit, alt } = cmToDisplay(cm);
    valEl.textContent = primary;
    unitEl.textContent = unit;
    altEl.textContent = alt;
    valEl.classList.remove('warn', 'close');
    if (cm < 15)      valEl.classList.add('close');
    else if (cm < 30) valEl.classList.add('warn');
  }

  function pushChart(cm) {
    const v = useMetric ? cm : cm / 2.54;
    data.push(v);
    if (data.length > HISTORY) data.shift();
    chart.data.datasets[0].data = [...data];
    chart.update('none');
  }

  let lastCm = null;

  toggleBtn.addEventListener('click', () => {
    useMetric = !useMetric;
    toggleBtn.textContent = useMetric ? 'Switch to ft / in' : 'Switch to m / cm';
    chart.options.scales.y.max = useMetric ? CM_MAX : IN_MAX;
    chart.options.scales.y.ticks.callback = v =>
      useMetric ? v.toFixed(0) + ' cm' : v.toFixed(0) + ' in';
    data.fill(null);
    chart.data.datasets[0].data = [...data];
    chart.update('none');
    if (lastCm !== null) updateReadout(lastCm);
  });

  // --- SSE ---
  let activeEs = null;

  function connect() {
    if (activeEs) activeEs.close();
    const ip = document.getElementById('ip').value.trim();
    statusEl.textContent = `connecting to ${ip}…`;
    statusEl.className = 'status';
    const es = new EventSource(`http://${ip}:5000/stream`);
    activeEs = es;

    es.onopen = () => {
      statusEl.textContent = 'live';
      statusEl.className = 'status ok';
    };

    es.onmessage = e => {
      const d = JSON.parse(e.data);
      lastCm = d.distance_cm;
      updateReadout(d.distance_cm);
      pushChart(d.distance_cm);
    };

    es.onerror = () => {
      if (es !== activeEs) return;
      statusEl.textContent = 'disconnected — reconnecting…';
      statusEl.className = 'status err';
      es.close();
      activeEs = null;
      setTimeout(connect, 3000);
    };
  }

  document.getElementById('reconnect').addEventListener('click', connect);

  connect();
</script>
</body>
</html>
